name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update source
        working-directory: /var/www/Marketplace-Management
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build Backend
        working-directory: /var/www/Marketplace-Management/Backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Frontend
        working-directory: /var/www/Marketplace-Management/FrontEnd
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Restart Backend
        run: |
          sudo systemctl restart marketplace-backend

      - name: Validate Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx